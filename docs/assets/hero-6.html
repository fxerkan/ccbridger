<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ccbridge hero 6 — desk / pocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600&display=block" rel="stylesheet">
<style>
/* Desk / pocket: a question on one side, the answer on the other. Pine and peach. */
html,body{margin:0;background:#0f3a37}
*{box-sizing:border-box}
.hero{width:1000px;height:420px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;
  font-family:"Schibsted Grotesk",sans-serif}
.desk{background:#0f3a37;color:#e6f2ec;padding:64px 40px 0 56px;position:relative}
.pocket{background:#ffcfb0;color:#2a1508;padding:0 56px 0 48px;position:relative}
.q{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:44px;line-height:1.18;letter-spacing:-.02em;margin:0}
.q .caret{display:inline-block;width:.55em;height:1em;background:#ffcfb0;vertical-align:-.14em;margin-left:.12em}
.cmd{margin-top:26px;font-family:"IBM Plex Mono",monospace;font-size:14.5px;color:#a9cfc2}
.cmd b{color:#e6f2ec;font-weight:500}
.yes{position:absolute;left:44px;top:66px;margin:0;font-family:"Bodoni Moda",serif;font-style:italic;font-weight:700;
  font-size:168px;line-height:.9;letter-spacing:-.04em;color:#c2330f}
.from{position:absolute;left:52px;top:236px;font-size:17px;font-weight:500;color:#5c3a26}
.foot{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;align-items:center}
.desk .foot{padding-left:56px;gap:10px;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:19px;letter-spacing:-.01em}
.pocket .foot{padding-left:52px;font-size:17px;font-weight:600;color:#2a1508}
</style></head><body>
<div class="hero">
  <div class="desk">
    <p class="q">Do you want<br>to proceed?<span class="caret"></span></p>
    <div class="cmd"><b>terraform apply</b> · infra · Bedrock</div>
    <div class="foot">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#e6f2ec" stroke-width="2.2" stroke-linecap="round">
        <path d="M4 18 C4 6 22 6 22 18" stroke="#ffcfb0"/><path d="M4 15v6M22 15v6M8 21h10"/>
      </svg>ccbridge
    </div>
  </div>
  <div class="pocket">
    <p class="yes">Yes.</p>
    <div class="from">sent from your phone, ten seconds later</div>
    <div class="foot">Your Bedrock coding sessions, in your pocket.</div>
  </div>
</div></body></html>
