<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="hero.css">
<style>
.wrap{position:absolute;inset:0;padding:34px 44px;display:flex;flex-direction:column;justify-content:center}
.row{display:flex;align-items:center;gap:22px}
.wm{font-size:84px}
.sub{margin:26px 0 0;font-size:27px;font-weight:650;letter-spacing:-.01em}
.tag{margin:9px 0 0;font-size:17px;color:var(--muted);font-style:italic}
.cli{margin-top:22px;width:fit-content}
.chips{margin-top:20px}
</style></head><body>
<div class="hero"><div class="grid"></div>
  <div class="wrap">
    <div class="row">
      <svg class="mark" width="104" height="104" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="#0a0b0d"/>
        <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#20242c" stroke-width="2"/>
        <path d="M112 330 C112 190 400 190 400 330" fill="none" stroke="#ff9d2e" stroke-width="40" stroke-linecap="round"/>
        <rect x="92" y="300" width="40" height="96" rx="20" fill="#272c35"/>
        <rect x="380" y="300" width="40" height="96" rx="20" fill="#272c35"/>
        <rect x="150" y="356" width="212" height="34" rx="17" fill="#272c35"/>
      </svg>
      <h1 class="wm">cc<span class="ac">bridge</span></h1>
    </div>
    <p class="sub">Your Bedrock coding sessions, in your pocket.</p>
    <p class="tag">No server, no open ports, one Python file.</p>
    <p class="cli">$ <b>ccb</b> ls <i>·</i> $ <b>ccb</b> ok <i>·</i> $ <b>ccb</b> answer <i>·</i> $ <b>ccb</b> send <i>·</i> $ <b>ccb</b> open</p>
    <div class="chips">
      <span class="chip"><b>◼</b>approvals on your phone</span>
      <span class="chip"><b>◼</b>two-way conversation</span>
      <span class="chip"><b>◼</b>per-user, nothing shared</span>
      <span class="chip"><b>◼</b>hooks + file queue</span>
    </div>
  </div>
</div></body></html>
